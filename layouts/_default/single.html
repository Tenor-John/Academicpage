{{ define "main" }}
<div class="skill-learning-page container-fluid">
  <article class="article-container max-width-none">
    <header class="article-header">
      {{ if .Params.title }}
      <h1 class="article-title">{{ .Title }}</h1>
      {{ end }}
      
      {{ if .Params.summary }}
      <p class="page-subtitle">{{ .Params.summary }}</p>
      {{ end }}
    </header>

    <div class="article-content section-content">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
